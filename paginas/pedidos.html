<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial Pedidos | Notes & Sillage</title>
  <meta name="description" content="Historial completo de pedidos al proveedor en Notes & Sillage.">
  <link rel="icon" type="image/x-icon" href="../docs/imagenes/imagenes promocional/favicon.ico">
  <link rel="icon" type="image/webp" href="../docs/imagenes/imagenes promocional/logo-notes-and-sillage-hd.webp">
  
  <!-- Estilos del Sistema -->
  <link rel="stylesheet" href="../funciones/css/ventas.css?v=20261118_font_and_icons_scale">
  <link rel="stylesheet" href="../funciones/css/pedidos.css?v=20261118_font_and_icons_scale">
  
  <!-- Script para mantener tema oscuro o claro y tamaño de letra antes de pintar -->
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('notes_theme');
        if (savedTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }

        var isMobile = window.innerWidth <= 768;
        if (!isMobile) {
          var savedFontSize = localStorage.getItem('notes_font_size');
          if (savedFontSize) {
            document.documentElement.style.fontSize = savedFontSize;
          }
        }
      } catch(e) {}
    })();
  </script>
</head>
<body class="sales-table-view pedidos-dashboard-view auth-checking">
  <div class="container-fluid">
    <!-- Encabezado Principal -->
    <header class="dashboard-header">
      <div class="brand-section">
        <a href="catalogo.html" class="brand-logo-link" title="Volver al Catálogo de Perfumes">
          <img src="../docs/imagenes/imagenes promocional/logo-notes-and-sillage-hd.webp" alt="Notes & Sillage" class="brand-logo" onerror="this.src='../docs/imagenes/imagenes promocional/favicon.ico'">
        </a>
        <div class="brand-title">
          <h1>Historial Pedidos</h1>
        </div>
      </div>
      <div class="header-actions">
        <a href="ventas.html" class="btn-secondary" title="Ir a la planilla de registro de ventas">
          <i data-lucide="table" aria-hidden="true"></i> Ventas
        </a>
        <a href="gastos.html" class="btn-secondary" title="Control de gastos, retiros de ganancias y liquidación mensual">
          <i data-lucide="wallet" aria-hidden="true"></i> Gastos y Balance
        </a>
        <button type="button" id="btnOpenSettingsModal" class="btn-secondary btn-header-icon" title="Ajustes, Configuración y Salir">
          <i data-lucide="settings" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <!-- Sección de Métricas de Pedidos (Colapsable con la misma lógica que Ventas) -->
    <section class="analytics-dashboard-section" id="pedidosKpiSection">
      <div class="analytics-header">
        <div class="analytics-header-title">
          <div class="analytics-title-wrap">
            <span class="analytics-icon-badge">
              <i data-lucide="bar-chart-3" aria-hidden="true"></i>
            </span>
            <div>
              <h2 class="analytics-title">Métricas de Pedidos</h2>
              <p class="analytics-subtitle">Inversión acumulada, compras al proveedor y total de fragancias</p>
            </div>
          </div>
        </div>
        <div class="analytics-header-actions">
          <button type="button" id="btnTogglePedidosKpi" class="btn-analytics-toggle" title="Mostrar u ocultar métricas" aria-expanded="true">
            <span id="btnTogglePedidosKpiText">Ocultar métricas</span>
            <i data-lucide="chevron-up" id="iconTogglePedidosKpi" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div class="analytics-body" id="pedidosKpiBody">
        <div class="summary-metrics-bar" id="summaryMetricsBar">
          <div class="metric-item">
            <span class="metric-label">Inversión Total en Pedidos</span>
            <span class="metric-value highlight-green" id="kpiTotalInversion">$0</span>
          </div>
          <div class="metric-divider"></div>
          <div class="metric-item">
            <span class="metric-label">Pedidos Realizados</span>
            <span class="metric-value" id="kpiTotalPedidos">0</span>
          </div>
          <div class="metric-divider"></div>
          <div class="metric-item">
            <span class="metric-label">Productos Solicitados</span>
            <span class="metric-value" id="kpiTotalUnidades">0 un.</span>
          </div>
          <div class="metric-divider"></div>
          <div class="metric-item">
            <span class="metric-label">Regalos del Proveedor</span>
            <span class="metric-value" style="color: #9333ea;" id="kpiTotalRegalos">0 un. ($0)</span>
          </div>
          <div class="metric-divider"></div>
          <div class="metric-item">
            <span class="metric-label">Inversión Media x Pedido</span>
            <span class="metric-value" id="kpiPromedioPedido">$0</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Filtros Rápidos por Mes -->
    <section class="pedidos-toolbar" style="margin-top: 12px; margin-bottom: 20px;">
      <div class="month-filter-group" id="monthFilterChips"></div>
    </section>

    <!-- Contenedor Principal: Historial de Pedidos por Mes -->
    <main id="containerOrdersView"></main>
  </div>

  <!-- Lucide Icons -->
  <script src="../funciones/js/lucide.min.js?v=20261120_v1"></script>
  <script>
    if (!window.lucide) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"><\/script>');
    }
  </script>
  <script>
    if (window.lucide && typeof window.lucide.createIcons === 'function') {
      try { lucide.createIcons(); } catch (e) { console.warn("Lucide init error:", e); }
    }
  </script>
  <!-- Dataset de Pedidos Base -->
  <script src="../funciones/js/pedidos-data.js?v=20261118_01"></script>
  <!-- Firebase Config (Firestore & Auth) -->
  <script type="module" src="../funciones/js/firebase-config.js?v=20261118_pedidos_sync"></script>
  <!-- Protección: exige una sesión registrada -->
  <script type="module" src="../funciones/js/private-page-guard.js"></script>
  <!-- Modal unificado de Ajustes y Tamaño de Letra -->
  <script type="module" src="../funciones/js/settings-modal.js?v=20261118_font_and_icons_scale"></script>
  <!-- Lógica y Sincronización en Vivo de Pedidos -->
  <script type="module" src="../funciones/js/pedidos.js?v=20261118_responsive_collapse"></script>
</body>
</html>
